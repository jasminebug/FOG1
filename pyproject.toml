[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fogzero-hzs"
version = "1.1.0"
description = "Centralized orchestration vs agentic swarm vs hybrid zero-touch swarm (HZS) for zero-touch fog computing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.26", "pandas>=2.0", "scipy>=1.11", "matplotlib>=3.8", "tabulate>=0.9"]

[tool.setuptools]
packages = ["fogzero"]
